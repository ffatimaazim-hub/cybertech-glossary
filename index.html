<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTech Glossary (AI-Powered)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #06b6d4;
            --accent-hover: #0891b2;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --code-bg: #020617;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .api-config-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }

        .key-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .key-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .search-box {
            position: relative;
            margin-bottom: 2rem;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 1rem 1.25rem;
            font-size: 1.1rem;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
        }

        .search-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 0 1.5rem;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: var(--accent-hover);
        }

        .dictionary-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .term-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .category-badge {
            background-color: rgba(6, 182, 212, 0.15);
            color: var(--accent-color);
            font-size: 0.85rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            border: 1px solid rgba(6, 182, 212, 0.3);
            font-weight: 600;
        }

        .term-desc {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .command-box {
            background-color: var(--code-bg);
            border-left: 3px solid var(--accent-color);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            word-break: break-all;
        }

        .status-msg {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="api-config-bar">
            <button class="key-btn" onclick="configureApiKey()">⚙️ Set Gemini API Key</button>
        </div>

        <header>
            <h1>🛡️ CyberTech Glossary</h1>
            <p>AI-Powered Real-Time Security Terms & Tools Search</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="যেকোনো টুল বা সিকিউরিটি টার্মের নাম লিখুন (যেমন: Ghidra, Wireshark, Kerberoasting)...">
            <button class="search-btn" onclick="searchAI()">Search</button>
        </div>

        <div id="dictionaryContainer" class="dictionary-grid"></div>
        <div id="statusMsg" class="status-msg">উপরে যেকোনো সাইবার সিকিউরিটি টুল বা টার্ম লিখে সার্চ করুন।</div>

        <footer>
            <p>© CyberTech Glossary - AI Engine Integrated</p>
        </footer>
    </div>

    <script>
        function getSavedKey() {
            return localStorage.getItem('GEMINI_API_KEY') || '';
        }

        function configureApiKey() {
            const currentKey = getSavedKey();
            const userKey = prompt("আপনার Google Gemini API Key টি পেস্ট করুন:", currentKey);
            if (userKey !== null) {
                localStorage.setItem('GEMINI_API_KEY', userKey.trim());
                alert("API Key সফলভাবে সেভ হয়েছে!");
            }
        }

        async function searchAI() {
            const query = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('dictionaryContainer');
            const statusMsg = document.getElementById('statusMsg');
            const apiKey = getSavedKey();

            if (!query) return;

            if (!apiKey) {
                alert("সার্চ করার আগে অনুগ্রহ করে 'Set Gemini API Key' বাটনে চাপ দিয়ে আপনার API Key টি সেভ করে নিন।");
                configureApiKey();
                return;
            }

            container.innerHTML = '';
            statusMsg.innerText = "AI উত্তর তৈরি করছে, অনুগ্রহ করে অপেক্ষা করুন...";
            statusMsg.style.display = "block";

            const prompt = `You are a Cybersecurity Expert API. Explain the cybersecurity term, attack technique, or tool named "${query}" in Bangla.
Return ONLY a JSON object (no markdown, no backticks, no text before or after) with the following structure:
{
  "term": "${query}",
  "category": "Category Name in English (e.g. Web Security / Malware Analysis / SOC)",
  "desc": "Short, clear technical description in Bengali",
  "cmd": "Common Linux/Windows command or usage example"
}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || "API Error");
                }

                let textResult = data.candidates[0].content.parts[0].text;
                textResult = textResult.replace(/```json/g, '').replace(/```/g, '').trim();
                const item = JSON.parse(textResult);

                statusMsg.style.display = "none";
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="term-title">${item.term}</span>
                            <span class="category-badge">${item.category || 'Cyber Security'}</span>
                        </div>
                        <p class="term-desc">${item.desc}</p>
                        <div class="command-box">${item.cmd || 'N/A'}</div>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                statusMsg.innerText = "API Key সঠিক নয় অথবা কোনো সমস্যা হয়েছে। দয়া করে API Key চেক করে আবার চেষ্টা করুন।";
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchAI();
            }
        });
    </script>
</body>
</html>
